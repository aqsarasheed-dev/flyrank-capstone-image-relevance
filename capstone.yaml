name: AI Image Understanding & Content Matching Engine
track: backend
capstone: image-relevance

run: docker compose up --build -d
seed: node scripts/seedImages.js && node scripts/seedPosts.js && node jobs/tagImages.js && node jobs/embed.js
test: npm test
base_url: http://localhost:3000

env_required:
  - GEMINI_API_KEY
  - DATABASE_URL
  - VISION_MODEL
  - EMBED_MODEL
  - SIMILARITY_THRESHOLD
  - LOW_CONFIDENCE_THRESHOLD

endpoints:
  - method: GET
    path: /health
    note: liveness + db connectivity
  - method: GET
    path: /images
    note: all images with validated tags; ?flagged=true shows low-confidence
  - method: GET
    path: /posts/red-fox-behavior/images
    note: "Probe 2 — fox ranks first, wolf and dog rank lower"
  - method: GET
    path: /posts/red-fox-behavior/evaluate/{wolf_image_id}
    note: "Probe 3 — guard REJECTS with a category-mismatch reason"
  - method: GET
    path: /posts/coral-reef-bleaching/images
    note: "Probe 4 — no confident match, with reasons"
  - method: GET
    path: /costs
    note: "Probe 6 — every AI call attributed with a cost"

eval:
  command: node scripts/eval.js
  metric: top-1 precision